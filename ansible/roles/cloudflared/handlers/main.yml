---
- name: Reload Cloudflared user systemd
  ansible.builtin.systemd_service:
    daemon_reload: true
    scope: user
  become: true
  become_user: "{{ cloudflared_user }}"
  environment: "{{ cloudflared_runtime_env }}"

- name: Restart Cloudflared
  ansible.builtin.systemd_service:
    name: cloudflared-pod.service
    scope: user
    state: restarted
  become: true
  become_user: "{{ cloudflared_user }}"
  environment: "{{ cloudflared_runtime_env }}"
