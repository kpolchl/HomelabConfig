---
- name: Create the cloudflared user
  ansible.builtin.user:
    name: "{{ cloudflared_user }}"
    shell: /bin/bash
    create_home: true
    comment: Cloudflared rootless container
  register: cloudflared_account

- name: Confirm subordinate ID ranges were allocated
  ansible.builtin.command: "grep -q '^{{ cloudflared_user }}:' {{ item }}"
  loop:
    - /etc/subuid
    - /etc/subgid
  changed_when: false

- name: Enable linger so the user's services start at boot
  ansible.builtin.command: "loginctl enable-linger {{ cloudflared_user }}"
  args:
    creates: "/var/lib/systemd/linger/{{ cloudflared_user }}"

- name: Wait for the user runtime directory
  ansible.builtin.wait_for:
    path: "/run/user/{{ cloudflared_account.uid }}"
    timeout: 30

- name: Remember the environment user-scope systemd needs
  ansible.builtin.set_fact:
    cloudflared_runtime_env:
      XDG_RUNTIME_DIR: "/run/user/{{ cloudflared_account.uid }}"
      DBUS_SESSION_BUS_ADDRESS: "unix:path=/run/user/{{ cloudflared_account.uid }}/bus"

- name: Create config directories, each owned by the user
  ansible.builtin.file:
    path: "{{ cloudflared_account.home }}/{{ item }}"
    state: directory
    owner: "{{ cloudflared_user }}"
    group: "{{ cloudflared_user }}"
    mode: "0755"
  loop:
    - .config
    - .config/containers
    - .config/containers/systemd

- name: Create the tunnel token as a Podman secret
  containers.podman.podman_secret:
    name: cloudflared_token
    data: "{{ cloudflared_token }}"
    state: present
    skip_existing: true
  become: true
  become_user: "{{ cloudflared_user }}"
  environment: "{{ cloudflared_runtime_env }}"
  no_log: true

- name: Render the Cloudflared environment file
  ansible.builtin.template:
    src: cloudflared.env.j2
    dest: "{{ cloudflared_account.home }}/.config/cloudflared.env"
    owner: "{{ cloudflared_user }}"
    group: "{{ cloudflared_user }}"
    mode: "0640"
  notify:
    - Reload Cloudflared user systemd
    - Restart Cloudflared

- name: Render the Quadlet files
  ansible.builtin.template:
    src: "{{ item }}.j2"
    dest: "{{ cloudflared_account.home }}/.config/containers/systemd/{{ item }}"
    owner: "{{ cloudflared_user }}"
    group: "{{ cloudflared_user }}"
    mode: "0644"
  loop:
    - cloudflared.pod
    - cloudflared-server.container
  notify:
    - Reload Cloudflared user systemd
    - Restart Cloudflared

- name: Apply pending handlers before starting services
  ansible.builtin.meta: flush_handlers

- name: Start the Cloudflared services
  ansible.builtin.systemd_service:
    name: "{{ item }}.service"
    scope: user
    state: started
  loop:
    - cloudflared-pod
    - cloudflared-server
  become: true
  become_user: "{{ cloudflared_user }}"
  environment: "{{ cloudflared_runtime_env }}"
  register: cloudflared_start
  retries: 5
  delay: 5
  until: cloudflared_start is succeeded
