---
- name: Reload Immich user systemd
  ansible.builtin.systemd_service:
    daemon_reload: true
    scope: user
  become: true
  become_user: "{{ immich_user }}"
  environment: "{{ immich_runtime_env }}"

- name: Restart Immich
  ansible.builtin.systemd_service:
    name: "{{ item }}.service"
    scope: user
    state: restarted
  loop:
    - immich-redis
    - immich-postgres
    - immich-ml
    - immich-server
  become: true
  become_user: "{{ immich_user }}"
  environment: "{{ immich_runtime_env }}"
