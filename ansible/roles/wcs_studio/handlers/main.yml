---
- name: Reload WcsStudio user systemd
  ansible.builtin.systemd_service:
    daemon_reload: true
    scope: user
  become: true
  become_user: "{{ wcs_studio_user }}"
  environment: "{{ wcs_studio_runtime_env }}"

- name: Restart WcsStudio
  ansible.builtin.systemd_service:
    name: wcs_studio-pod.service
    scope: user
    state: restarted
  become: true
  become_user: "{{ wcs_studio_user }}"
  environment: "{{ wcs_studio_runtime_env }}"
